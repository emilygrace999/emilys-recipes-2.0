<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emily's Recipes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#c9b6ea; --purple-deep:#8f66c9;
    --pink:#f7bfd6; --pink-deep:#e8629b;
    --green:#b3e3c2; --green-deep:#4fae78;
    --blue:#aedcf2; --blue-deep:#3ea3d6;
    --cream:#fffaf6; --paper:#ffffff;
    --ink:#453a56; --ink-soft:#7a6f8c; --line:#eee0f2;
    --shadow: 0 10px 30px rgba(150,110,180,0.14);
    --shadow-sm: 0 4px 14px rgba(150,110,180,0.12);
    --radius-lg: 26px; --radius-md: 18px; --radius-sm: 12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 8% 4%, rgba(247,191,214,0.55) 0%, transparent 40%),
      radial-gradient(circle at 92% 10%, rgba(174,220,242,0.55) 0%, transparent 42%),
      radial-gradient(circle at 15% 92%, rgba(179,227,194,0.55) 0%, transparent 42%),
      radial-gradient(circle at 88% 88%, rgba(201,182,234,0.55) 0%, transparent 45%),
      #fffaf6;
    background-attachment: fixed;
    color:var(--ink); font-family:'Nunito', sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  h1,h2,h3,h4,.display{ font-family:'Baloo 2','Nunito',sans-serif; font-weight:700; color:var(--ink); margin:0; }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit;}
  img{max-width:100%; display:block;}
  ::selection{background:var(--pink); color:#3a2a44;}

  /* ---------- top bar / search ---------- */
  .topbar{ position:sticky; top:0; z-index:50; background:rgba(255,250,246,0.9); backdrop-filter: blur(10px); border-bottom:1px solid var(--line); }
  .topbar-inner{ max-width:1200px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:10px; cursor:pointer; flex-shrink:0; }
  .brand-mark{ width:38px; height:38px; border-radius:12px; background:linear-gradient(135deg, var(--pink), var(--purple)); display:flex; align-items:center; justify-content:center; font-size:19px; box-shadow:var(--shadow-sm); }
  .brand-text{ font-family:'Baloo 2'; font-weight:800; font-size:19px; color:var(--ink); line-height:1;}
  .brand-text span{ display:block; font-family:'Nunito'; font-weight:600; font-size:11px; letter-spacing:0.06em; color:var(--ink-soft); text-transform:uppercase; margin-top:2px;}
  .search-wrap{ flex:1 1 260px; min-width:220px; position:relative; }
  .search-wrap input{ width:100%; padding:11px 16px 11px 40px; border-radius:999px; border:2px solid var(--line); background:var(--paper); font-size:14.5px; color:var(--ink); outline:none; transition:border-color .15s ease, box-shadow .15s ease; }
  .search-wrap input:focus{ border-color:var(--purple); box-shadow:0 0 0 4px rgba(201,182,234,0.25); }
  .search-icon{ position:absolute; left:14px; top:50%; transform:translateY(-50%); opacity:0.55; font-size:15px; }
  .nav-links{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .nav-links button{ background:none; border:none; padding:8px 12px; border-radius:999px; font-weight:700; font-size:13.5px; color:var(--ink-soft); cursor:pointer; transition:background .15s ease, color .15s ease; }
  .nav-links button:hover, .nav-links button.active{ background:var(--purple); color:#fff; }
  .filter-row{ max-width:1200px; margin:0 auto; padding:0 20px 14px; display:flex; gap:8px; flex-wrap:wrap; }
  .chip{ padding:6px 13px; border-radius:999px; font-size:12.5px; font-weight:700; border:1.5px solid var(--line); background:var(--paper); color:var(--ink-soft); cursor:pointer; transition: all .15s ease; }
  .chip:hover{ border-color:var(--purple); }
  .chip.active{ background:var(--ink); border-color:var(--ink); color:#fff; }

  .page{ max-width:1200px; margin:0 auto; padding:36px 20px 90px; position:relative; }

  .hero{ display:flex; align-items:center; justify-content:space-between; gap:30px; margin-bottom:34px; flex-wrap:wrap; }
  .hero-text h1{ font-size:clamp(30px,5vw,44px); line-height:1.08; }
  .hero-text h1 em{ font-style:normal; background:linear-gradient(90deg,var(--pink-deep),var(--purple-deep)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero-text p{ margin-top:12px; color:var(--ink-soft); font-size:16px; max-width:460px; }

  .home-layout{ display:flex; gap:34px; align-items:flex-start; }
  .icon-shelf{
    flex-shrink:0; width:216px; padding:18px; border-radius:28px;
    background: linear-gradient(160deg, #ffd9ea 0%, #e3caff 35%, #c3e8ff 68%, #c7f0d3 100%);
    box-shadow: var(--shadow);
  }
  .icon-rail{ display:flex; flex-direction:column; gap:12px; }
  .cat-icon{
    display:flex; align-items:center; gap:13px; padding:12px 14px; border-radius:20px; cursor:pointer;
    background:rgba(255,255,255,0.92); box-shadow:0 3px 10px rgba(80,40,90,0.10);
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease;
  }
  .cat-icon:hover{ transform: scale(1.07) translateX(3px); box-shadow:0 8px 18px rgba(80,40,90,0.18); }
  .cat-icon .swatch{ width:44px; height:44px; border-radius:15px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:21px; box-shadow: inset 0 -3px 6px rgba(0,0,0,0.08); }
  .cat-icon .label{ font-family:'Baloo 2'; font-weight:700; font-size:14.5px; }
  .cat-icon .sub{ font-size:10.5px; color:var(--ink-soft); font-weight:600; }
  .swatch.c-breakfast{ background:linear-gradient(145deg,#ffd9ea,#f28fb8); }
  .swatch.c-snacks{ background:linear-gradient(145deg,#ffe3b8,#ffb35c); }
  .swatch.c-main{ background:linear-gradient(145deg,#c3e8ff,#4fa9e0); }
  .swatch.c-sides{ background:linear-gradient(145deg,#c7f0d3,#57c584); }
  .swatch.c-dessert{ background:linear-gradient(145deg,#e3caff,#a06ee0); }
  .swatch.c-drinks{ background:linear-gradient(145deg,#b8f2ea,#3ecfc0); }
  .swatch.c-favorites{ background:linear-gradient(145deg,#ffc9c9,#ff6f8a); }
  .swatch.c-add{ background:linear-gradient(145deg,#f4f0ff,#c9b6ea); color:#5b3d8a; font-weight:800; }

  .home-right{ flex:1; min-width:0; }
  .section-title{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; }
  .section-title h2{ font-size:21px; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:20px; }
  .card{ background:var(--paper); border-radius:var(--radius-md); overflow:hidden; box-shadow:var(--shadow-sm); cursor:pointer; border:1px solid var(--line); transition: transform .18s ease, box-shadow .18s ease; position:relative; }
  .card:hover{ transform:translateY(-4px); box-shadow:var(--shadow); }
  .card .thumb{ width:100%; aspect-ratio:4/3; object-fit:cover; background:linear-gradient(135deg,#f3e6f7,#e6f0fb); }
  .card .fav-btn{ position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.92); border:none; cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-sm); }
  .card .body{ padding:14px 15px 16px; }
  .card .cat-tag{ font-size:10.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:var(--purple-deep); }
  .card h3{ font-size:15.5px; margin-top:4px; line-height:1.3; }
  .card .meta{ display:flex; align-items:center; gap:8px; margin-top:8px; font-size:12px; color:var(--ink-soft); font-weight:600; }
  .card .tagrow{ display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; }
  .card .tagrow span{ font-size:10.5px; background:var(--cream); border:1px solid var(--line); padding:2px 8px; border-radius:999px; color:var(--ink-soft); font-weight:700; }

  .empty{ text-align:center; padding:70px 20px; color:var(--ink-soft); }
  .empty .big{ font-size:40px; margin-bottom:10px; }

  .cat-header{ display:flex; align-items:center; gap:16px; margin-bottom:30px; }
  .cat-header .swatch{ width:58px; height:58px; border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:28px; }
  .back-link{ display:inline-flex; align-items:center; gap:6px; font-weight:700; color:var(--ink-soft); font-size:13.5px; cursor:pointer; margin-bottom:16px; }
  .back-link:hover{ color:var(--purple-deep); }

  .recipe-head{ margin-bottom:6px; }
  .recipe-title-row{ display:flex; align-items:flex-start; gap:14px; justify-content:space-between; flex-wrap:wrap; }
  .recipe-title-row h1{ font-size:clamp(26px,4vw,36px); line-height:1.15; }
  .heart-btn{ background:var(--paper); border:2px solid var(--line); width:46px; height:46px; border-radius:50%; font-size:19px; cursor:pointer; flex-shrink:0; box-shadow:var(--shadow-sm); transition: transform .15s ease; }
  .heart-btn:hover{ transform:scale(1.1); }
  .heart-btn.is-fav{ background:linear-gradient(135deg,var(--pink),var(--purple)); border-color:transparent; }
  .recipe-meta{ display:flex; flex-wrap:wrap; gap:14px; margin:12px 0 6px; color:var(--ink-soft); font-size:13.5px; font-weight:600; }
  .recipe-meta .stars{ color:#e8a23b; font-weight:800; }
  .source-line{ font-size:13px; color:var(--ink-soft); margin-top:4px; }
  .source-line a{ color:var(--purple-deep); font-weight:700; }
  .action-row{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin:22px 0 8px; padding:14px 18px; background:var(--paper); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow-sm); }
  .btn{ padding:10px 18px; border-radius:999px; border:none; font-weight:800; font-size:13.5px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; transition: transform .15s ease, opacity .15s ease; }
  .btn:hover{ transform:translateY(-1px); }
  .btn-primary{ background:linear-gradient(135deg,var(--purple),var(--pink)); color:#3a2a44; }
  .btn-ghost{ background:var(--cream); color:var(--ink); border:1.5px solid var(--line); }
  .btn-danger{ background:#ffe3e3; color:#b5354a; border:1.5px solid #ffc9c9; }
  .switch-wrap{ display:flex; align-items:center; gap:9px; margin-left:auto; }
  .switch-label{ font-size:13px; font-weight:700; color:var(--ink-soft); }
  .switch{ width:44px; height:25px; border-radius:999px; background:var(--line); position:relative; cursor:pointer; border:none; transition:background .2s ease; flex-shrink:0; }
  .switch::after{ content:""; position:absolute; top:3px; left:3px; width:19px; height:19px; border-radius:50%; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,0.25); transition:transform .2s ease; }
  .switch.on{ background:linear-gradient(135deg,var(--green-deep),var(--blue-deep)); }
  .switch.on::after{ transform:translateX(19px); }
  .wake-status{ font-size:11.5px; color:var(--green-deep); font-weight:700; }
  .photos{ display:grid; grid-template-columns:1fr; gap:14px; margin:22px 0; }
  .photos img{ width:100%; border-radius:var(--radius-md); box-shadow:var(--shadow-sm); background:linear-gradient(135deg,#f3e6f7,#e6f0fb); }
  .desc{ font-size:15.5px; line-height:1.7; color:var(--ink); margin:18px 0; }
  #recipe-core{ margin-top:34px; scroll-margin-top:90px; }
  .core-grid{ display:grid; grid-template-columns: 1fr 1.5fr; gap:34px; }
  @media (max-width:760px){ .core-grid{ grid-template-columns:1fr; } .home-layout{ flex-direction:column; } .icon-shelf{ width:100%; } .icon-rail{ flex-direction:row; flex-wrap:wrap; } .cat-icon{ flex:1 1 150px; } }

  .panel{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-md); padding:22px 24px; box-shadow:var(--shadow-sm); }
  .panel h3{ font-size:16px; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
  .ingredients-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .ingredients-list li{ display:flex; gap:10px; align-items:flex-start; font-size:14.5px; line-height:1.5; }
  .ingredients-list li::before{ content:"●"; color:var(--purple); font-size:8px; margin-top:7px; }
  .steps-list{ list-style:none; margin:0; padding:0; counter-reset:step; display:flex; flex-direction:column; gap:16px; }
  .steps-list li{ counter-increment:step; display:flex; gap:14px; font-size:14.5px; line-height:1.65; }
  .steps-list li::before{ content:counter(step); flex-shrink:0; width:28px; height:28px; border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--green)); color:#2c4a3e; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center; }

  .nutrition-panel{ margin-top:24px; }
  .nutrition-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); gap:12px; margin-top:6px; }
  .nut-cell{ text-align:center; background:var(--cream); border-radius:14px; padding:12px 6px; border:1px solid var(--line); }
  .nut-cell .num{ font-family:'Baloo 2'; font-weight:800; font-size:18px; color:var(--purple-deep); }
  .nut-cell .lbl{ font-size:10.5px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.03em; margin-top:2px; }
  .nut-caption{ font-size:11.5px; color:var(--ink-soft); margin-top:10px; font-style:italic; }

  .notes-panel{ margin-top:24px; }
  .notes-panel textarea{ width:100%; min-height:120px; border-radius:14px; border:1.5px solid var(--line); padding:14px; font-family:inherit; font-size:14px; color:var(--ink); resize:vertical; outline:none; background:var(--cream); }
  .notes-panel textarea:focus{ border-color:var(--purple); }
  .notes-save-row{ display:flex; align-items:center; gap:12px; margin-top:10px; }
  .save-status{ font-size:12.5px; color:var(--green-deep); font-weight:700; opacity:0; transition:opacity .3s ease; }
  .save-status.show{ opacity:1; }
  .footer-note{ text-align:center; margin-top:70px; color:var(--ink-soft); font-size:12.5px; }

  /* ---------- add-a-recipe form ---------- */
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:700px){ .form-grid{ grid-template-columns:1fr; } }
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  .field label{ font-size:12.5px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; }
  .field input, .field select, .field textarea{
    padding:10px 13px; border-radius:12px; border:1.5px solid var(--line); background:var(--cream);
    font-family:inherit; font-size:14px; color:var(--ink); outline:none; resize:vertical;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--purple); }
  .tagcheck-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .tagcheck{ display:flex; align-items:center; gap:5px; padding:6px 11px; border-radius:999px; border:1.5px solid var(--line); font-size:12px; font-weight:700; color:var(--ink-soft); cursor:pointer; background:var(--cream); }
  .tagcheck input{ accent-color: var(--purple-deep); }
  .paste-box{ background:linear-gradient(160deg,#fff5fa,#f3f0ff); border:2px dashed var(--purple); border-radius:20px; padding:20px; margin-bottom:26px; }
  .paste-box h3{ font-size:16px; margin-bottom:6px; }
  .paste-box p{ font-size:13px; color:var(--ink-soft); margin:0 0 12px; line-height:1.5;}
  .paste-box textarea{ width:100%; min-height:140px; border-radius:14px; border:1.5px solid var(--line); padding:14px; font-family:inherit; font-size:13.5px; color:var(--ink); resize:vertical; outline:none; background:var(--paper); }
  .hint{ font-size:12px; color:var(--ink-soft); margin-top:6px; }

  #print-only{ display:none; }
  @media print{ #print-only{ display:none !important; } }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand" onclick="navigate('home')">
      <div class="brand-mark">🌸</div>
      <div class="brand-text">Emily's Recipes<span>whole food · plant-based · gf · df</span></div>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input id="search-input" type="text" placeholder="Search recipes, ingredients, or 'chocolate granola'…" oninput="onSearchInput(this.value)">
    </div>
    <div class="nav-links">
      <button onclick="navigate('home')" id="nav-home">Home</button>
      <button onclick="navigate('favorites')" id="nav-fav">♡ Favorites</button>
      <button onclick="navigate('add')" id="nav-add">＋ Add a Recipe</button>
    </div>
  </div>
  <div class="filter-row" id="filter-row"></div>
</div>

<div class="page" id="app"></div>

<script>
/* =========================================================
   PLACEHOLDER IMAGE (used if a photo fails to load)
========================================================= */
const PLACEHOLDER_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360">
     <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
       <stop offset="0%" stop-color="#f3e6f7"/><stop offset="100%" stop-color="#dcefe0"/>
     </linearGradient></defs>
     <rect width="100%" height="100%" fill="url(#g)"/>
     <text x="50%" y="52%" font-size="72" text-anchor="middle" dominant-baseline="middle">🌷</text>
   </svg>`
);
function imgTag(src, alt, cls){
  const safeAlt = esc(alt);
  return `<img class="${cls}" src="${esc(src)}" alt="${safeAlt}" referrerpolicy="no-referrer" loading="lazy" onerror="this.onerror=null;this.src='${PLACEHOLDER_IMG}';">`;
}

/* =========================================================
   DATA
========================================================= */
const CATEGORIES = [
  {id:'breakfast', label:'Breakfast', sub:'mornings', icon:'🥞', swatch:'c-breakfast'},
  {id:'snacks',    label:'Snacks',    sub:'anytime',  icon:'🥨', swatch:'c-snacks'},
  {id:'main',      label:'Main Dishes', sub:'dinner', icon:'🍲', swatch:'c-main'},
  {id:'sides',     label:'Sides',     sub:'to share', icon:'🥗', swatch:'c-sides'},
  {id:'dessert',   label:'Dessert',   sub:'sweet tooth', icon:'🍰', swatch:'c-dessert'},
  {id:'drinks',    label:'Drinks',    sub:'sip & glow', icon:'🥤', swatch:'c-drinks'},
  {id:'favorites', label:'Favorites', sub:'your picks', icon:'💗', swatch:'c-favorites'},
  {id:'add',       label:'Add a Recipe', sub:'grow the site', icon:'＋', swatch:'c-add'},
];
const REAL_CATEGORIES = CATEGORIES.filter(c=>c.id!=='favorites' && c.id!=='add');

const ALL_TAGS = ["Oil-Free","No Added Sugar","Date-Sweetened","No-Bake","Bake","One-Pot","Quick","Freezer-Friendly","Make-Ahead","Kid-Friendly"];

const BUILT_IN_RECIPES = [
{
  id:'banana-oat-muffins', category:'breakfast',
  title:'Banana Oat Muffins',
  image:'https://eatplant-based.com/wp-content/uploads/2024/07/Banana-Oat-Muffins-0617.jpg',
  source:{name:'EatPlant-Based', url:'https://eatplant-based.com/banana-oat-muffins/'},
  rating:4.4, reviews:58, prep:20, cook:25, servings:'15 muffins', servingsCount:15,
  tags:['Bake','Freezer-Friendly','Kid-Friendly','Date-Sweetened'],
  description:"Soft, moist muffins built on gluten-free oat flour with no added oil — ripe banana and applesauce keep them tender. Swap the sugar for date sugar or a pinch of stevia to keep them fully unrefined-sugar-free.",
  ingredients:["2 cups gluten-free oat flour (blend GF rolled oats until powdery)","1 tsp baking powder","1 tsp baking soda","1 tsp cinnamon","1/2 tsp salt","1/2 cup date sugar (or stevia to taste)","1 large ripe banana, mashed","1 cup unsweetened applesauce","1/2 cup unsweetened plant milk","1 tbsp vanilla extract","1 tsp apple cider vinegar","1/4 cup chopped walnuts (optional)"],
  steps:["Preheat the oven to 350°F. Blend gluten-free rolled oats in a blender until they turn into a fine flour — about 2 cups.","Whisk the oat flour together with the baking powder, baking soda, cinnamon, salt, and sweetener in a large bowl.","In a separate bowl, mash the banana, then whisk in the applesauce, plant milk, vanilla, and vinegar.","Pour the wet mixture into the dry ingredients and stir until just combined. Fold in walnuts if using.","Divide the batter among a silicone muffin pan (paper liners tend to stick since there's no oil in this batter).","Bake for 25 minutes, until a toothpick inserted in the center comes out clean. Cool before serving."]
},
{
  id:'oat-energy-balls', category:'breakfast',
  title:'Almond Butter Oat Energy Balls',
  image:'https://eatplant-based.com/wp-content/uploads/2024/06/oat-energy-balls-0048.jpg',
  source:{name:'EatPlant-Based', url:'https://eatplant-based.com/oat-energy-balls/'},
  rating:5.0, reviews:8, prep:10, cook:0, servings:'12 balls', servingsCount:12,
  tags:['No-Bake','Quick','Freezer-Friendly','Kid-Friendly'],
  description:"No-cook, no-fuss energy bites loaded with oats, seeds, and dried fruit. Mix, roll, chill — done in ten minutes and perfect for busy mornings.",
  ingredients:["1 cup gluten-free quick oats","1/4 cup chopped walnuts","1/4 cup dried blueberries (unsweetened)","1/4 cup dried cranberries (unsweetened or juice-sweetened)","2 tbsp sunflower seeds","2 tbsp pumpkin seeds","2 tbsp flax seeds","2 tbsp chia seeds","3/4 cup almond butter","2 tbsp mashed date paste (or maple syrup)","1 tsp vanilla extract","1/2 tsp salt","1/2 tsp cinnamon","1/4 tsp nutmeg"],
  steps:["Stir the oats, walnuts, dried blueberries and cranberries, sunflower seeds, pumpkin seeds, flax, and chia seeds together in a large bowl.","Add the almond butter, date paste, vanilla, salt, cinnamon, and nutmeg, and mix until sticky and well combined. Add a splash more almond butter if it's too dry, or a few more oats if too wet.","Roll into balls about the size of a ping-pong ball.","Chill in the fridge to firm up, or press into a lined dish and cut into bars instead. Store in an airtight container."]
},
{
  id:'granola-bars', category:'snacks',

{
  id:'feel-good-granola-bars', category:'snacks',

  tags:['Bake','Oil-Free','No Added Sugar','Freezer-Friendly'],
  description:"Soft-baked, hearty bars sweetened only with banana and dried fruit — no oil and no added sugar at all, just oats, nuts, and seeds pressed into a pan.",
  nutrition:{cal:200, p:6, c:20, f:11, fi:4, source:'as published by Oh She Glows'},
  ingredients:["1½ cups mashed ripe banana (about 3 large)","1 tsp pure vanilla extract","2 cups gluten-free rolled oats","1/2 to 3/4 cup unsweetened dried cherries, cranberries, or blueberries","1/2 cup walnuts, chopped","1/2 cup sunflower seeds","1/2 cup pepita seeds","1/2 cup sliced almonds","1/4 cup hemp hearts","1 tsp cinnamon","1/4 tsp fine sea salt"],
  steps:["Preheat the oven to 350°F. Line a 9x13-inch baking dish with parchment paper, leaving an overhang.","Mash the banana until smooth (you want 1½ cups) and stir in the vanilla.","Pulse the oats in a food processor or blender until coarsely chopped, then stir into the banana mixture.","Stir in the dried fruit, walnuts, sunflower and pepita seeds, almonds, hemp hearts, cinnamon, and salt until fully combined — the dough will be heavy and a bit wet.","Spoon into the prepared dish and press firmly into an even layer with damp hands.","Bake 22-26 minutes, until firm and lightly golden at the edges. Cool completely on a rack before slicing into bars."]

  tags:['Oil-Free','One-Pot','Freezer-Friendly'],

  ingredients:["1 red bell pepper, diced","1/2 yellow onion, diced","2 cloves garlic, minced","3½ cups canned crushed tomatoes","1 cup canned green lentils, drained and rinsed","3½ cups vegetable broth, divided","2 tsp ground cumin","2 tsp chili powder","1 tsp sea salt","1/4 tsp cayenne pepper","1-2 tbsp maple syrup, or a few drops of stevia","1 cup frozen corn","1 cup chopped cilantro","2 tbsp almond butter"],

  description:"A creamy, fragrant curry that doubles up on legumes — canned chickpeas and green lentils simmered with coconut milk and spinach. A small amount of oil is used to soften the onion.",
  ingredients:["1 tbsp oil (a light amount is used here to soften the onion)","1 onion, finely chopped","1/2 tsp salt","4 garlic cloves, finely chopped","1½ tbsp minced fresh ginger","1 small chile, thinly sliced (optional, to taste)","2 tsp ground cumin","1 tsp ground fenugreek (optional)","1 tsp ground turmeric","1 (14 oz) can tomatoes","1 (14 oz) can chickpeas, drained and rinsed","1 (14 oz) can green lentils, drained and rinsed","2 cups water or vegetable stock","1 (7 oz) can coconut milk","3½ oz fresh spinach","1 lime, zest and juice","1 tsp garam masala","Small handful fresh cilantro, chopped"],

const WHOLE_ITEM_G = {"banana":118,"lime":67,"lemon":58,"avocado":170,"onion":110,"potatoes":170,"russet potatoes":170,"bell pepper":120,"garlic cloves":3,"garlic":3};
const UNIT_G = {"cup":120,"cups":120,"tbsp":15,"tablespoon":15,"tablespoons":15,"tsp":5,"teaspoon":5,"teaspoons":5,"oz":28,"ounce":28,"ounces":28,"lb":454,"lbs":454,"pound":454,"g":1,"gram":1,"grams":1,"kg":1000,"ml":1,"l":1000,"can":240,"cans":240,"clove":3,"cloves":3,"pinch":0.3,"pinches":0.3,"handful":15};

function parseQtyToken(tok){
  if(!tok) return null;
  tok = tok.trim();
  const fracMap = {'½':0.5,'¼':0.25,'¾':0.75,'⅓':0.333,'⅔':0.667,'⅛':0.125};
  let total = 0, found=false;
  const parts = tok.split(/\s+/);
  for(const p of parts){
    if(fracMap[p]!==undefined){ total += fracMap[p]; found=true; continue; }
    if(/^\d+\/\d+$/.test(p)){ const [a,b]=p.split('/').map(Number); total += a/b; found=true; continue; }
    if(/^\d+(\.\d+)?$/.test(p)){ total += parseFloat(p); found=true; continue; }
    // number+glued fraction like "1½"
    const m = p.match(/^(\d+)?([½¼¾⅓⅔⅛])$/);
    if(m){ total += (m[1]?parseInt(m[1]):0) + fracMap[m[2]]; found=true; continue; }
  }
  return found ? total : null;
}

function estimateNutrition(recipe){
  if(recipe.nutrition) return {cal:recipe.nutrition.cal,p:recipe.nutrition.p,c:recipe.nutrition.c,f:recipe.nutrition.f,fi:recipe.nutrition.fi, source:recipe.nutrition.source};
  const dbKeys = Object.keys(NUTRI_DB).sort((a,b)=>b.length-a.length);
  let totals = {cal:0,p:0,c:0,f:0,fi:0};
  (recipe.ingredients||[]).forEach(line=>{
    if(!line || line.startsWith('—')) return;
    const lower = line.toLowerCase();
    // find matching db ingredient (longest match first)
    let matchKey = null;
    for(const k of dbKeys){ if(lower.includes(k)){ matchKey = k; break; } }
    if(!matchKey) return;
    const vals = NUTRI_DB[matchKey];
    // extract leading quantity + unit
    const m = lower.match(/^([\d.\/½¼¾⅓⅔⅛\s]+)?\s*([a-z]+)?/);
    let qty = m ? parseQtyToken(m[1]) : null;
    let unitWord = m && m[2] ? m[2].replace(/[^a-z]/g,'') : null;
    let grams;
    if(unitWord && UNIT_G[unitWord] !== undefined){
      grams = (qty || 1) * UNIT_G[unitWord];
    } else if(WHOLE_ITEM_G[matchKey] !== undefined){
      grams = (qty || 1) * WHOLE_ITEM_G[matchKey];
    } else if(qty){
      grams = qty * 100; // best guess fallback
    } else {
      grams = 60; // small unspecified amount fallback
    }
    const scale = grams/100;
    totals.cal += vals.cal*scale; totals.p += vals.p*scale; totals.c += vals.c*scale; totals.f += vals.f*scale; totals.fi += vals.fi*scale;
  });
  const n = Math.max(recipe.servingsCount||1,1);
  return {
    cal: Math.round(totals.cal/n), p: Math.round((totals.p/n)*10)/10,
    c: Math.round((totals.c/n)*10)/10, f: Math.round((totals.f/n)*10)/10, fi: Math.round((totals.fi/n)*10)/10,
    source:'estimated automatically from the ingredient list'
  };
}

const LS_PREFIX = 'emilys-recipes:';
async function getFavorites(){ try{ const v = localStorage.getItem(LS_PREFIX+'favorites'); return v ? JSON.parse(v) : []; }catch(e){ return []; } }
async function setFavorites(arr){ try{ localStorage.setItem(LS_PREFIX+'favorites', JSON.stringify(arr)); }catch(e){} }
async function toggleFavorite(id){ const favs = await getFavorites(); const idx = favs.indexOf(id); if(idx>-1) favs.splice(idx,1); else favs.push(id); await setFavorites(favs); return favs; }
async function getNote(id){ try{ const v = localStorage.getItem(LS_PREFIX+'note-'+id); return v || ''; }catch(e){ return ''; } }
async function saveNote(id, text){ try{ localStorage.setItem(LS_PREFIX+'note-'+id, text); return true; }catch(e){ return false; } }
async function getCustomRecipes(){ try{ const v = localStorage.getItem(LS_PREFIX+'custom-recipes'); return v ? JSON.parse(v) : []; }catch(e){ return []; } }

function matchesQuery(r, q){ if(!q) return true; q = q.toLowerCase(); const hay = [r.title, r.description, ...(r.ingredients||[]), ...(r.tags||[])].join(' ').toLowerCase(); return hay.includes(q); }

function printRecipe(id){

/* ---------- wake lock ---------- */
async function toggleWakeLock(){
  const btn = document.getElementById('wake-switch');
  const status = document.getElementById('wake-status');
  const isOn = btn.classList.contains('on');
  if(isOn){
    if(wakeLock){ try{ await wakeLock.release(); }catch(e){} wakeLock=null; }
    btn.classList.remove('on'); status.textContent = '';
  } else {
    try{
      if(!('wakeLock' in navigator)) throw new Error('unsupported');
      wakeLock = await navigator.wakeLock.request('screen');
      btn.classList.add('on'); status.textContent = 'Screen will stay on while cooking';
      wakeLock.addEventListener('release', ()=>{ btn.classList.remove('on'); status.textContent = ''; });
    }catch(e){
      status.textContent = "Couldn't keep the screen on in this browser/tab.";
    }
  }
}
document.addEventListener('visibilitychange', async ()=>{
  if(document.visibilityState==='visible' && document.getElementById('wake-switch')?.classList.contains('on')){
    try{ wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
  }
});

        <div class="tagcheck-row">${ALL_TAGS.map(t=>`<label class="tagcheck"><input type="checkbox" value="${t}" class="f-tag"> ${t}</label>`).join('')}</div>
      </div>
      <div class="field"><label>Short description</label><textarea id="f-desc" rows="2" placeholder="A sentence or two about this recipe"></textarea></div>
      <div class="field"><label>Ingredients (one per line)</label><textarea id="f-ingredients" rows="8" placeholder="1 cup rolled oats&#10;2 ripe bananas&#10;…"></textarea></div>
      <div class="field"><label>Instructions (one step per line)</label><textarea id="f-steps" rows="8" placeholder="Preheat the oven to 350°F.&#10;Mash the bananas in a bowl.&#10;…"></textarea></div>
      <div class="hint">Nutrition will be estimated automatically from your ingredient list once saved — no extra step needed.</div>
      <div style="margin-top:18px; display:flex; gap:12px;">
        <button class="btn btn-primary" onclick="saveNewRecipe()">💾 Save recipe</button>
        <button class="btn btn-ghost" onclick="navigate('home')">Cancel</button>
      </div>
    </div>
  `;
  document.getElementById('nav-add').classList.add('active');
}

function autoFillFromPaste(){
  const raw = document.getElementById('paste-area').value;
  if(!raw || !raw.trim()){ alert('Paste some recipe text first!'); return; }
  const lines = raw.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  const ingHeadingIdx = lines.findIndex(l=>/^(ingredients?)\s*:?$/i.test(l) || /^ingredients?\b/i.test(l) && l.length<40);
  const stepHeadingIdx = lines.findIndex((l,i)=> i>(ingHeadingIdx>-1?ingHeadingIdx:0) && (/^(instructions?|directions?|method|steps?)\s*:?$/i.test(l) || (/^(instructions?|directions?|method|steps?)\b/i.test(l) && l.length<40)));

  let title, descLines=[], ingLines=[], stepLines=[];

  if(ingHeadingIdx > -1 && stepHeadingIdx > -1){
    title = lines[0];
    descLines = lines.slice(1, ingHeadingIdx);
    ingLines = lines.slice(ingHeadingIdx+1, stepHeadingIdx);
    stepLines = lines.slice(stepHeadingIdx+1);
  } else {
    // heuristic fallback: classify each line as ingredient-ish or instruction-ish
    title = lines[0];
    const unitWords = /\b(cup|cups|tbsp|tablespoon|tsp|teaspoon|oz|ounce|lb|pound|clove|pinch|can|g|gram|kg|ml|handful)\b/i;
    const leadingNum = /^[\d.\/½¼¾⅓⅔⅛]/;
    for(let i=1;i<lines.length;i++){
      const l = lines[i];
      if(leadingNum.test(l) && unitWords.test(l) && l.length<90){ ingLines.push(l); }
      else if(leadingNum.test(l) || l.length>60){ stepLines.push(l); }
      else if(ingLines.length===0 && stepLines.length===0){ descLines.push(l); }
      else { stepLines.push(l); }
    }
  }
  function stripBullet(s){ return s.replace(/^[-•*▢\[\]\s]+/,'').replace(/^\d+[\.\)]\s*/,'').replace(/^step\s*\d+\s*[:\.]?\s*/i,'').trim(); }

  document.getElementById('f-title').value = title || '';
  document.getElementById('f-desc').value = descLines.join(' ').slice(0,300);
  document.getElementById('f-ingredients').value = ingLines.map(stripBullet).filter(Boolean).join('\n');
  document.getElementById('f-steps').value = stepLines.map(stripBullet).filter(Boolean).join('\n');
  document.getElementById('f-title').scrollIntoView({behavior:'smooth', block:'center'});
}

async function bulkImportRecipes(){
  const raw = document.getElementById('bulk-area').value.trim();
  const status = document.getElementById('bulk-status');
  if(!raw){ status.style.color = '#b5354a'; status.textContent = 'Paste some recipe JSON first.'; return; }
  let data;
  try{ data = JSON.parse(raw); }
  catch(e){ status.style.color = '#b5354a'; status.textContent = "Couldn't read that as valid JSON — check for a missing bracket or comma."; return; }
  if(!Array.isArray(data)) data = [data];

  const validCats = REAL_CATEGORIES.map(c=>c.id);
  let added = 0, skipped = 0;
  data.forEach((item, i)=>{
    if(!item || !item.title || !Array.isArray(item.ingredients) || !Array.isArray(item.steps) || item.ingredients.length===0 || item.steps.length===0){
      skipped++; return;
    }
    const cat = validCats.includes(item.category) ? item.category : 'main';
    const servingsCount = parseInt(item.servingsCount) || 4;
    CUSTOM_RECIPES.push({
      id: 'custom-' + Date.now() + '-' + i,
      category: cat,
      title: String(item.title),
      image: item.image || PLACEHOLDER_IMG,
      source: (item.sourceName || item.sourceUrl) ? {name: item.sourceName || 'source', url: item.sourceUrl || '#'} : {name:'Added by you', url:'#'},
      rating: 5.0, reviews: 0,
      prep: parseInt(item.prep)||0, cook: parseInt(item.cook)||0,
      servings: servingsCount + ' servings', servingsCount: servingsCount,
      tags: Array.isArray(item.tags) ? item.tags.filter(t=>ALL_TAGS.includes(t)) : [],
      description: item.description || 'A recipe added by Emily.',
      ingredients: item.ingredients.map(String),
      steps: item.steps.map(String),
      custom: true
    });
    added++;
  });

  if(added>0){ await saveCustomRecipes(CUSTOM_RECIPES); }
  status.style.color = added>0 ? 'var(--green-deep)' : '#b5354a';
  status.textContent = `Added ${added} recipe${added!==1?'s':''}.` + (skipped>0 ? ` Skipped ${skipped} (missing title/ingredients/steps).` : '');
  if(added>0){ document.getElementById('bulk-area').value=''; setTimeout(()=>navigate('home'), 1200); }
}

async function saveNewRecipe(){
  const title = document.getElementById('f-title').value.trim();
  const ingredients = document.getElementById('f-ingredients').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const steps = document.getElementById('f-steps').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!title || ingredients.length===0 || steps.length===0){
    alert('Please fill in at least a title, ingredients, and instructions.');
    return;
  }
  const tags = Array.from(document.querySelectorAll('.f-tag:checked')).map(el=>el.value);
  const servingsCount = parseInt(document.getElementById('f-servings-count').value) || 4;
  const sourceName = document.getElementById('f-source-name').value.trim();
  const sourceUrl = document.getElementById('f-source-url').value.trim();
  const newRecipe = {
    id: 'custom-' + Date.now(),
    category: document.getElementById('f-category').value,
    title: title,
    image: document.getElementById('f-image').value.trim() || PLACEHOLDER_IMG,
    source: sourceName || sourceUrl ? {name: sourceName || 'your own recipe', url: sourceUrl || '#'} : {name:'Added by you', url:'#'},
    rating: 5.0, reviews: 0,
    prep: parseInt(document.getElementById('f-prep').value)||0,
    cook: parseInt(document.getElementById('f-cook').value)||0,
    servings: servingsCount + ' servings', servingsCount: servingsCount,
    tags: tags,
    description: document.getElementById('f-desc').value.trim() || 'A recipe added by Emily.',
    ingredients: ingredients,
    steps: steps,
    custom: true
  };
  CUSTOM_RECIPES.push(newRecipe);
  await saveCustomRecipes(CUSTOM_RECIPES);
  navigate('recipe', newRecipe.id);
}

/* =========================================================
   MAIN RENDER DISPATCH
========================================================= */
async function render(){
  renderFilterRow();
  document.getElementById('nav-home').classList.toggle('active', state.route==='home');
  document.getElementById('nav-fav').classList.toggle('active', state.route==='favorites');
  document.getElementById('nav-add').classList.toggle('active', state.route==='add');
  document.getElementById('search-input').value = state.query;

  if(state.route==='favorites'){ await renderFavorites(); return; }
  if(state.route==='recipe'){ await renderRecipe(state.recipeId); return; }
  if(state.route==='add'){ renderAddRecipe(); return; }

  await refreshFavCache();
  const app = document.getElementById('app');
  if(state.route==='category') app.innerHTML = renderCategory(state.categoryId);
  else if(state.route==='search') app.innerHTML = renderSearch();
  else app.innerHTML = renderHome();
}

(async function init(){
  CUSTOM_RECIPES = await getCustomRecipes();
  render();
})();
</script>
